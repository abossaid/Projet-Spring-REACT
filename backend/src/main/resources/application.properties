# ===== Server =====
server.port=8080

# ===== H2 Database (file-based so data persists between restarts) =====
spring.datasource.url=jdbc:h2:file:./data/librarydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===== H2 Console (browse the DB at http://localhost:8080/h2-console) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== File upload limits (for ebook PDFs) =====
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===== Directory where uploaded PDF files are stored =====
app.upload.dir=./uploads

# ===== JWT configuration =====
# Read from the JWT_SECRET environment variable; the base64 value after the
# colon is only a local-dev fallback so the app runs with zero setup.
# In production, export JWT_SECRET (a base64-encoded key of at least 256 bits).
app.jwt.secret=${JWT_SECRET:bXktc3VwZXItc2VjcmV0LWtleS1mb3ItZGlnaXRhbC1saWJyYXJ5LW1hbmFnZW1lbnQtc3lzdGVtLTIwMjU=}
# Token validity in milliseconds (24 hours), overridable via JWT_EXPIRATION_MS
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
